# Global OMP agent config — swarm host plus the merged model pool.
#
# Two parsers read this file, and the stricter one is not omp. The
# ufo-fsd-alpha seat resolver (Projects/ufo-fsd-alpha/scripts/omp-global-config.mjs)
# reads it with a hand-rolled dialect and fails closed unless these rules
# hold, so keep them when editing:
#   - top-level modelRoles, task and retry sections, each declared once at
#     column 0 and each spelled as a bare `key:` line with nothing after the
#     colon — an inline note on the header line makes the section read as
#     missing, and a second column-0 spelling of the same name (even inside
#     what looks like a comment block) makes it read as ambiguous
#   - two-space indent, no tabs anywhere, no duplicate keys
#   - map values are scalars only (no flow lists/maps, no block scalars)
#   - chains are `- item` lines indented strictly deeper than their key; all
#     chain keys sit at one shared indent; only an empty chain may use
#     `key: []`, and a `key: []` that then carries items is refused
#   - task.agentModelOverrides carries every ufo seat, or the launcher refuses
#   - an alias in modelRoles must name a concrete route, never another @alias
#   - every retry.fallbackChains key must be a modelRoles key, a modelRoles
#     value, or a resolved seat route; anything else is rejected as dead weight
#
# Two further gates read the derived table, not this file, and constrain it
# just as hard. scripts/sync-global-routing.mjs splitRoute-validates every
# seat primary and every seat chain step: effort suffixes must be one of
# low|medium|high|xhigh|max (`minimal` is illegal in a seat chain), and any
# gemini-family route is refused unless it starts with google-antigravity/.
# crates/ufo-core-runtime/build.rs then requires each seat's primary-plus-chain
# to be non-empty with pairwise-distinct BARE models — effort stripped — so a
# chain may never repeat a model at another effort, including its own primary.
# Only the fourteen ufo seats are checked that way, which leaves the omp roles,
# the effort variants and the pool-member aliases unguarded by any gate. This
# file therefore holds itself to the STRICTEST rule everywhere: every route in
# it — every modelRoles value and every step of all forty-five chains, seat or
# not — is splitRoute-legal, and every chain is bare-distinct against its own
# primary. host/apply.mjs enforces that over the whole table, so a typo in an
# alias no seat consumes still fails the dry run instead of surfacing at
# dispatch time. Two consequences worth knowing: `minimal` is not a legal ufo
# effort suffix, so it appears nowhere here even in the omp-role chains that
# would tolerate it; and no chain steps its own primary down to a lower effort.
#
# Model pool = the models the m_* lanes name, on the providers authenticated
# on this host. `enabledModels` below is set to exactly that set: every role
# value and every chain step appears in it, so nothing a cascade can reach is
# hidden, and everything else the bundled catalog carries — deepseek-v4-pro,
# kimi-for-coding*, the devin fusion family, superseded gpt-5.6, dated
# variants — is out of scope for the pickers, cycling and /model.
# `enabledProviders` stays unset: it filters discovery sources, not models.
#
# The two providers the operator excluded are deliberately absent from this
# file — no route and no comment names either one, so a grep for them comes
# back empty. kimi-code appears only as a terminal fallback hop and never as a
# seat primary: it is the declared secondary, and its monthly budget is the one
# being protected.
#
# The operator's three alibaba token-plan credentials are all stored as omp
# ACCOUNTS behind the single `alibaba-token-plan` provider id (imported with
# `omp login alibaba-token-plan`, International region), and omp round-robins
# accounts per provider — so every alibaba selector below names one lane and
# omp balances the three keys internally. The kimi-code CLI separately keeps
# its own three-provider copy of the same keys over one base URL; those `-2` /
# `-3` spellings are a kimi-code config artifact and are not omp-addressable.
# Two accuracy notes on verifying this: `omp usage` shows no token-plan section
# because the quota-reporting cookie was skipped at login, and `omp token
# alibaba-token-plan --list` enumerates OAuth accounts only. The evidence that
# the accounts are live is therefore the serving catalog check — `omp models
# alibaba-token-plan` returns the 11-model table from the credential store with
# no environment variable set — not a list command.
#
# Chain keys come in three forms, one chain per route, no duplicates:
# role names (default/smol/slow/plan), the ufo seat aliases (kept byte-for-byte
# with the seat-routing table so regenerating the mirror is a no-op), and
# concrete selectors for the host flagship lanes. omp resolves a concrete
# `provider/model:effort` key BEFORE any role key (resolveRetryFallbackChainKey:
# exact model key, then provider wildcard, then role), so a concrete key
# SHADOWS the alias sharing its primary — the two must carry identical hops or
# the seat silently walks the concrete list. A primary shared by several roles
# carries no concrete key at all (one key cannot hold three cascades); named
# selection of such a selector falls to the first matching role key in
# declaration order, which is plan for deepseek-v4.1-flash:max.
#
# Effort is granular per bucket via variant aliases (m_mid_med, m_mid_low,
# m_fast_high); the L1 picks the variant per mission/round/wave. Seat pins use
# the default-effort bucket alias. A variant names the same model as its bucket
# at a lower declared effort and reuses the bucket's hop sequence byte-for-byte
# — the hops are capacity fallbacks, so their efforts do not move with the
# primary's. Variants carry alias-level chains only: nothing requires every
# modelRoles value to also own a concrete-selector chain key, only that every
# declared chain key resolves, so the variants stay lean. The effort each
# variant names is a real one in omp's live catalog AND a legal ufo route
# suffix — which excludes `minimal` outright. The strong bucket deliberately
# carries NO variants: the operator quota directive routed it onto
# deepseek-v4.1-flash, whose live efforts are only high,max, so its only lower
# rung (:high) already exists as m_fast_high. That still describes m_fast_high;
# m_strong itself is momentarily on codex gpt-6.1-sol:high.
#
# No key material belongs in this file. The resolver screens every line and key
# it echoes into an error message and redacts anything credential-shaped; the
# outright refusal to load a file that still carries a credential shape after
# sanitizing lives in scripts/prepare-ephemeral-fleet.mjs, not in the parser.
setupVersion: 2

# Larger context windows where supported (the ufo L1 lane needs 1M tokens).
extendedContext: true

# Catalog scope — only the models the m_* lanes name, on every authenticated
# provider that serves them. Everything else the bundled catalog carries (deepseek-v4-pro,
# kimi-for-coding*, the devin fusion family, dated and superseded variants) is hidden from
# the pickers, cycling and /model. Routing is unaffected: every selector a chain can reach
# appears below, so no fallback resolves outside this scope.
enabledModels:
  - "alibaba-token-plan/deepseek-v4.1-flash"
  - "alibaba-token-plan/qwen3.8-flash"
  - "alibaba-token-plan/qwen3.8-max"
  - "charm-hyper/deepseek-v4.1-flash"
  - "charm-hyper/glm-5.3"
  - "charm-hyper/glm-5.3-flash"
  - "charm-hyper/kimi-k3"
  - "charm-hyper/qwen3.8-flash"
  - "charm-hyper/qwen3.8-max"
  - "cursor/claude-haiku-5-5"
  - "cursor/claude-haiku-5-5-1m"
  - "cursor/composer-2.5-fast"
  - "cursor/cursor-grok-4.5"
  - "cursor/grok-4.7"
  - "cursor/kimi-k3"
  - "devin/claude-haiku-5-5"
  - "devin/deepseek-v4-1-flash"
  - "devin/glm-5-3-1m"
  - "devin/glm-5-3-flash-1m"
  - "devin/gpt-6-1-sol"
  - "devin/gpt-6-luna"
  - "devin/grok-4-5"
  - "devin/grok-4-7"
  - "devin/kimi-k3"
  - "devin/swe-2"
  - "google-antigravity/gemini-3.8-flash"
  - "kimi-code/k3"
  - "kimi-code/kimi-for-coding"
  - "openai-codex/gpt-6-luna"
  - "openai-codex/gpt-6.1-sol"
  - "opencode-go/deepseek-v4.1-flash"
  - "xai-oauth/grok-4.5"
  - "xai-oauth/grok-4.7"
  - "xai-oauth/grok-composer-2.5-fast"
  - "zai/glm-5.3"
  - "zai/glm-5.3-flash"

modelRoles:
  # --- omp role selectors ---
  # default: the m_sol lane (openai-codex gpt-6.1-sol:max) — the 2026-10-10
  # operator session moved the everyday default onto the codex flagship at its
  # top effort; codex headroom on this host remains the reason it lives there.
  default: openai-codex/gpt-6.1-sol:max
  # smol: cheap flash lane per the operator — qwen3.6-flash is out of the pool
  # entirely and the flash bucket runs qwen3.8-flash. Still carries vision, so
  # titles, prewalk and probe work stay on-model.
  smol: alibaba-token-plan/qwen3.8-flash:high
  # plan: architecture and planning — same flash route as default per the
  # quota directive.
  plan: alibaba-token-plan/deepseek-v4.1-flash:max
  # --- the three ufo buckets, referenced as @name from agentModelOverrides ---
  # m_strong: the L1, the planner and the critic. MOMENTARY (2026-10-12): the
  # operator moved this seat onto openai-codex gpt-6.1-sol:high, so its cascade
  # is the devin twin of that model and nothing else. The deepseek-v4.1-flash
  # ladder it carried lives on in m_fast and plan; restoring this line and its
  # chain to alibaba-token-plan/deepseek-v4.1-flash:max brings it back. The
  # 1M-context caveat that lane carried still applies there: the declaration
  # comes from the kimi-code-side catalog, omp's live row is sparse (no context
  # metadata), so the l1Context floor is unverifiable from omp — the same class
  # of gap as the previous 872K L1 that no gate caught.
  m_strong: openai-codex/gpt-6.1-sol:high
  # m_qwen38max: the named strong-class lane for qwen3.8-max, back in the pool
  # per the operator (the earlier quota ban is lifted). The live catalog
  # declares efforts low,medium,xhigh — there is no :max rung, so xhigh is the
  # top of this lane. Seats stay on @m_strong; this lane is addressable as
  # @m_qwen38max for fleet specs and L1 selection. (It used to lead the
  # m_strong cascade; that bucket is momentarily on codex gpt-6.1-sol.)
  m_qwen38max: alibaba-token-plan/qwen3.8-max:xhigh
  # m_mid: general implementation, review, watch and execute. high is the
  # ceiling omp's live catalog declares for qwen3.8-flash.
  m_mid: alibaba-token-plan/qwen3.8-flash:high
  # m_fast: mechanical lanes, probes, distill and scribe.
  m_fast: alibaba-token-plan/deepseek-v4.1-flash:max
  # --- effort variants of the three buckets: same model, lower declared
  # effort, identical hop sequence. No seat pins to these; the L1 selects one
  # per mission/round/wave, which is the granularity mechanism ---
  # qwen3.8-flash live efforts are minimal,low,medium,high. minimal is not a
  # legal ufo route suffix, so low is the floor variant and there is no
  # m_mid_min.
  m_mid_med: alibaba-token-plan/qwen3.8-flash:medium
  m_mid_low: alibaba-token-plan/qwen3.8-flash:low
  # deepseek-v4.1-flash live efforts are high,max, so max has exactly one
  # lower rung.
  m_fast_high: alibaba-token-plan/deepseek-v4.1-flash:high
  # --- pool members no seat currently consumes ---
  # m_antigravity: the gemini ban's one exemption and the connector seat's
  # historical family. google-antigravity is authenticated on this host now
  # (2026-10-11 catalog: 15 models), but the operator's current seat table
  # still pins connector to @m_mid; the alias and its chain stay declared so
  # moving the seat is a one-line edit.
  m_antigravity: google-antigravity/gemini-3.8-flash:high
  # m_composer: composer-fast, xai-oauth leading per the operator — its
  # grok-composer-2.5-fast row is the same 200K-window model under xai's
  # branding — with cursor as the secondary. The xai row declares no thinking
  # levels and no image input, so this route carries no effort suffix and an
  # image-bearing turn must not lead here. cursor's "Other Models" monthly
  # budget is exhausted, which is why it does not lead.
  m_composer: xai-oauth/grok-composer-2.5-fast
  # m_swe: the named devin lane. The devin-agent api family declares no
  # efforts at all, so this route carries no effort suffix — the same spelling
  # convention as swe-1-6. Devin is authenticated in omp now (two accounts,
  # Max plan) and the live catalog serves swe-2, so this lane is live. Devin
  # also backs the deepseek/glm-5.3 secondaries across the cascades per the
  # operator: the same models on devin — deepseek-v4-1-flash,
  # glm-5-3-1m and glm-5-3-flash-1m lead the hops of the matching alibaba/zai
  # primaries. swe stays out of those lanes — it routes only here.
  m_swe: devin/swe-2
  # --- host flagship lanes: the strongest model per authenticated provider,
  # addressable as @m_k3 / @m_sol / @m_glm53 and keyed concretely below ---
  m_k3: kimi-code/k3:max
  # m_kfc: kimi-for-coding, the kimi lane the operator actually runs (k3 above
  # stays declared as the provider flagship). kimi-code is the only provider
  # serving it, so its cascade is the explicit `[]` — no fallback.
  m_kfc: kimi-code/kimi-for-coding:high
  m_sol: openai-codex/gpt-6.1-sol:max
  m_glm53: zai/glm-5.3:max
  # m_grok: plain pool member, NOT a flagship — the operator classifies grok
  # below flagship grade. Both grok-4.20 variants are excluded from routing
  # (multi-agent and reasoning alike), so the lane sits on grok-4.7 at xhigh,
  # its top declared effort. Its cascade is the same model on cursor, then devin.
  m_grok: xai-oauth/grok-4.7:xhigh
  # --- cursor-branch ufo lanes (added 2026-10-11): the model set the
  # operator ran at ufo-fsd-alpha over the Cursor CLI (the origin.cursor.com
  # remote, selfrefine waves; seat table mirrored in
  # crates/ufo-core-runtime/bundled/omp-seat-routing.json on
  # cursor/selfrefine/*). Each lane is omp-addressable as @name, and each one
  # owns a provider cascade below — same bare model on every other
  # authenticated provider that serves it, and nothing else: no cross-model
  # tail. Alias
  # names match the branch seat table for continuity. opencode-go sits before
  # devin in every deepseek-v4.1-flash cascade (wired 2026-10-12); it holds 4
  # OpenCode Go accounts. ---
  # m_zfl: zai glm-5.3-flash at max, its top declared effort. The branch ran
  # glm-5.3-flashx at xhigh on nine seats; the operator substituted
  # glm-5.3-flash (2026-10-11), which charm-hyper also serves — so unlike
  # flashx this lane has a real provider cascade: the same model on
  # charm-hyper leads it.
  m_zfl: zai/glm-5.3-flash:max
  # m_flash: deepseek-v4.1-flash at max — the model's one lane.
  # alibaba-token-plan leads per the operator, then the same model on
  # opencode-go (4 OpenCode Go accounts behind the one provider id,
  # round-robined by omp the way the alibaba token-plan accounts are), then
  # devin.
  m_flash: alibaba-token-plan/deepseek-v4.1-flash:max
  # m_luna: gpt-6-luna at max, its top effort — a lane the operator runs.
  # devin serves the same bare model, so its cascade opens there.
  m_luna: openai-codex/gpt-6-luna:max
  # m_grok45: the branch's cheap grok hop, promoted to a lane at :high, its
  # top declared effort on xai-oauth. Cursor and devin serve the same bare
  # model, so its cascade is those two providers.
  m_grok45: xai-oauth/grok-4.5:high
  # m_haiku: the cheap-fast anthropic lane (2026-10-11). Two providers serve
  # plain claude-haiku-5-5: devin (1M context) and cursor (300K and 1M
  # variants). devin leads because the cursor "Other Models" monthly budget
  # was exhausted as of the m_composer note — the cursor hops are the
  # provider redundancy, live the moment that budget resets. Effort :high:
  # haiku is chosen for velocity, so the lane sits one rung under its top.
  m_haiku: devin/claude-haiku-5-5:high

task:
  # Thirty-two concurrent subagents — omp's own default, set explicitly per
  # operator directive. ufo-fsd-alpha pins 0 ("no host cap") in its per-run
  # overlays and bounds lane width itself (32-100 per wave, 100 members per
  # L1), so this cap governs plain omp swarm runs on this host and nothing
  # else. It is a real parallelism ceiling: pair with matching memory
  # headroom before raising further.
  #
  # Three separate 32s now coincide and are NOT one setting: this
  # task.maxConcurrency (omp's own subagent cap), sighting.dispatch.swarm's
  # waveMinLanes (ufo's per-wave floor, raised from 16 to 32), and
  # nativeProfiles.omp-native-v1.concurrencyCeiling. The last of those stays 32
  # on purpose — it is a per-L1 judged-round topology bound, not an L1 count,
  # and it is validated only as a positive integer, so nothing cross-checks it
  # against the other two. sighting.dispatch.maxConcurrentL1 is the L1 count
  # and moves independently to 16.
  maxConcurrency: 32
  # main -> executor -> probe nesting needs exactly depth 2 (operator
  # directive); deeper fan-out is not used by any current seat.
  maxRecursionDepth: 2
  # The ufo seat table: 3 strong + 5 mid + 6 fast = 14. The resolver fails
  # closed when a seat is missing, so all fourteen seats from
  # omp-seat-routing.json are declared. reviewer and scout are also omp bundled
  # agent names (omp ships reviewer, scout, security-reviewer, sonic, task), so
  # those two omp subagents run on the same route ufo gives those seats. Every
  # other key here is inert for omp and read only by ufo.
  #
  # reviewer and revenger are promoted to @m_mid here: both are thinking-class
  # roles on a thinkingMs deadline and were under-provisioned on the old fast
  # family. connector joins them on @m_mid per the operator's current seat
  # table (google-antigravity is authenticated now; moving connector onto it
  # is an operator decision, not a config default).
  #
  # main MUST stay "@m_strong": build.rs refuses to compile unless
  # seats.main.alias equals sighting.dispatch.missionFormat.l1Alias, and the
  # dispatch delta sets that alias to m_strong.
  agentModelOverrides:
    connector: "@m_mid"
    critic: "@m_strong"
    distiller: "@m_fast"
    executor: "@m_mid"
    labrat: "@m_fast"
    main: "@m_strong"
    mutation-tester: "@m_fast"
    planner: "@m_strong"
    revenger: "@m_mid"
    reviewer: "@m_mid"
    scout: "@m_fast"
    scribe: "@m_fast"
    sentinel: "@m_mid"
    simplifier: "@m_fast"

retry:
  modelFallback: true
  fallbackChains:
    # --- omp roles ---
    # default: primary gpt-6.1-sol:max; the cascade is the same bare model on
    # devin and nothing else.
    default:
      - "devin/gpt-6-1-sol:max"
    # smol: the cheap and vision-capable end of the pool. qwen3.6-flash is
    # banned per the operator; charm-hyper serves the same qwen3.8-flash, so
    # the cascade is charm-hyper.
    smol:
      - "charm-hyper/qwen3.8-flash:high"
    # plan: architecture cascade — the same model on devin then charm, and
    # nothing else.
    plan:
      - "opencode-go/deepseek-v4.1-flash:max"
      - "devin/deepseek-v4-1-flash:max"
      - "charm-hyper/deepseek-v4.1-flash:max"

    # --- ufo seat bucket chains: these three are the ones the compile gate
    # validates, so each is non-empty, carries pairwise-distinct bare models,
    # and never repeats its own primary at another effort ---
    # m_strong: primary openai-codex/gpt-6.1-sol:high (MOMENTARY, 2026-10-12).
    # The cascade is the devin twin of that model; the deepseek ladder this
    # bucket used to walk is still declared on m_fast and plan.
    m_strong:
      - "devin/gpt-6-1-sol:high"
    # m_qwen38max: primary alibaba-token-plan/qwen3.8-max:xhigh — the named
    # strong-class lane. charm-hyper serves the same bare model; the operator
    # scoped devin to the deepseek/zai primaries, so charm-hyper is the
    # whole cascade.
    m_qwen38max:
      - "charm-hyper/qwen3.8-max:xhigh"
    # m_mid: primary alibaba-token-plan/qwen3.8-flash:high.
    m_mid:
      - "charm-hyper/qwen3.8-flash:high"
    # m_fast: primary alibaba-token-plan/deepseek-v4.1-flash:max. The first
    # secondary is the same model on devin per the operator.
    m_fast:
      - "opencode-go/deepseek-v4.1-flash:max"
      - "devin/deepseek-v4-1-flash:max"
      - "charm-hyper/deepseek-v4.1-flash:max"
    # --- effort-variant chains: each reuses its bucket's hop sequence
    # byte-for-byte. Only the primary's effort differs, so a variant stays
    # compile-legal even if a future seat pins to one: the primary's bare
    # model still collides with none of the hops. The strong bucket has no
    # variant chains: deepseek-v4.1-flash's only lower rung (:high) already
    # exists as m_fast_high, and the m_qwen38max lane covers the strong class
    # at its top effort. m_strong is momentarily off that family entirely, so
    # its chain below is the codex twin instead. ---
    m_mid_med:
      - "charm-hyper/qwen3.8-flash:high"
    m_mid_low:
      - "charm-hyper/qwen3.8-flash:high"
    # m_fast_high: variant chain reuses the m_fast hop sequence byte-for-byte,
    # devin hop included.
    m_fast_high:
      - "opencode-go/deepseek-v4.1-flash:max"
      - "devin/deepseek-v4-1-flash:max"
      - "charm-hyper/deepseek-v4.1-flash:max"

    # --- pool-member chains: declared so each alias is reachable, consumed by
    # no seat today. alibaba glm-5.3 is deliberately absent from every chain —
    # the live catalog declares no efforts for it ---
    m_antigravity: []
    m_composer:
      - "cursor/composer-2.5-fast:high"
    m_swe: []
    m_k3:
      - "devin/kimi-k3:max"
      - "charm-hyper/kimi-k3:max"
      - "cursor/kimi-k3:max"
    m_kfc: []
    m_sol:
      - "devin/gpt-6-1-sol:max"
    m_glm53:
      - "charm-hyper/glm-5.3:max"
      - "devin/glm-5-3-1m:max"
    # m_grok: the same bare model on cursor, then devin.
    # Both grok-4.20 variants are excluded from routing per the operator.
    m_grok:
      - "cursor/grok-4.7:xhigh"
      - "devin/grok-4-7:xhigh"

    # --- cursor-branch lane chains (2026-10-11): provider cascades for the
    # models the operator ran at ufo-fsd-alpha on the Cursor CLI. Each carries
    # every OTHER authenticated provider serving the same bare model and
    # nothing else — a provider outage steps across, capability intact.
    # Single-provider models (gemini-3.8-flash, swe-2, kimi-for-coding) have
    # no same-model hop to open on, so their chains are the explicit `[]`: no
    # fallback at all. gemini hops stay google-antigravity-only (the splitRoute
    # gate refuses cursor's gemini copies). opencode-go sits before devin in
    # every deepseek-v4.1-flash cascade. Alias chains and
    # concrete keys carry identical hops, matching
    # the m_sol/m_glm53/m_grok convention above ---
    m_zfl:
      - "charm-hyper/glm-5.3-flash:max"
      - "devin/glm-5-3-flash-1m:max"
    m_flash:
      - "opencode-go/deepseek-v4.1-flash:max"
      - "devin/deepseek-v4-1-flash:max"
    m_luna:
      - "devin/gpt-6-luna:max"
    m_grok45:
      - "cursor/cursor-grok-4.5:high"
      - "devin/grok-4-5:high"
    # m_haiku: provider cascade across both haiku-5.5 providers — cursor's
    # 1M variant first (same model, second provider), then its 300K sibling,
    # then the standard cheap tail.
    m_haiku:
      - "cursor/claude-haiku-5-5-1m:high"
      - "cursor/claude-haiku-5-5:high"

    # --- host flagship lanes, keyed by concrete selector so the cascade
    # applies whether the model was picked as @m_k3 or by name. Each of these
    # keys is byte-for-byte one of the distinct non-variant modelRoles values
    # above, which is what keeps the dead-weight rule satisfied: change an
    # effort suffix in modelRoles and the matching key here must change
    # identically or the whole file fails to load. The three effort-variant
    # values deliberately have NO concrete key — the rule constrains declared
    # chain keys, not modelRoles values, so omitting them keeps the file lean
    # without making anything dead weight. A value shared by several roles —
    # default+m_sol on gpt-6.1-sol:max, plan+m_fast on deepseek-v4.1-flash:max,
